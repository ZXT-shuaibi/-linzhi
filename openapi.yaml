openapi: 3.0.3
info:
  title: 邻里知光 API
  version: 1.0.0
  description: |
    基于《邻里知光-技术分档-详细版》与补充 docx 整理的目标态接口文档。
    当前工作区无代码快照，本规范用于联调、评审与后续 Swagger/Knife4j/Postman 导入。
servers:
  - url: /api/v1
    description: 默认 API 前缀
security:
  - BearerAuth: []
tags:
  - name: Auth
    description: 认证与令牌生命周期
  - name: Discover
    description: LBS 附近发现
  - name: Posts
    description: 草稿、元数据与发布
  - name: Storage
    description: OSS 预签名上传
  - name: Search
    description: 搜索与联想
  - name: Rag
    description: RAG 流式问答
  - name: Interactions
    description: 点赞与收藏
  - name: Follows
    description: 关注关系
  - name: Social
    description: 用户社交计数
  - name: Profile
    description: 个人资料与个人主页
  - name: Feed
    description: 首页 Feed
  - name: Trade
    description: 秒杀与订单
  - name: Ops
    description: 限流、线程池和指标
x-internal-events:
  - name: counter-event
    maturity: 已实现
    source: 原文明确
    topic: counter-event
    eventTypes: [LIKE_CHANGED, FAVORITE_CHANGED]
    trigger: 点赞或收藏位图状态发生变化
    payloadSchema: '#/components/schemas/CounterEventPayload'
    idempotencyKey: eventId
    compensation: Kafka 重放、位图重建、DLQ
  - name: follow-event
    maturity: 已实现
    source: 原文明确
    topic: follow-event
    eventTypes: [FOLLOW_CREATED, FOLLOW_REMOVED]
    trigger: 关注主表与 outbox 事务提交后
    payloadSchema: '#/components/schemas/FollowEventPayload'
    idempotencyKey: eventId
    compensation: 粉丝计数修复、关注列表重建
  - name: post-published
    maturity: 已实现
    source: 原文明确
    topic: post-published
    eventTypes: [POST_PUBLISHED]
    trigger: 内容发布成功后
    payloadSchema: '#/components/schemas/PostPublishedPayload'
    idempotencyKey: eventId
    compensation: 摘要重试、搜索索引回填、Feed 刷新
  - name: rag-index-rebuild
    maturity: 已实现
    source: 基于需求推导
    topic: rag-index-rebuild
    eventTypes: [RAG_INDEX_REBUILD_REQUESTED]
    trigger: 文章内容更新或索引重建请求
    payloadSchema: '#/components/schemas/RagIndexRebuildPayload'
    idempotencyKey: postId+version
    compensation: 切片全量重建
  - name: seckill-success
    maturity: 规划中
    source: 原文明确
    topic: seckill-success
    eventTypes: [SECKILL_PRECHECK_PASSED]
    trigger: 秒杀预检通过后
    payloadSchema: '#/components/schemas/SeckillSuccessPayload'
    idempotencyKey: requestId
    compensation: 重新入队或标记失败
  - name: order-timeout
    maturity: 规划中
    source: 基于需求推导
    topic: order-timeout
    eventTypes: [ORDER_PAYMENT_TIMEOUT]
    trigger: 未支付订单超时
    payloadSchema: '#/components/schemas/OrderTimeoutPayload'
    idempotencyKey: orderId+expireAt
    compensation: 关单补偿、库存回补
