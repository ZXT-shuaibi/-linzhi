components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    SizeParam:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SearchAfterParam:
      name: searchAfter
      in: query
      schema:
        type: string
      description: Base64 缂栫爜鐨?search_after 娓告爣
    LatParam:
      name: lat
      in: query
      schema:
        type: number
        format: double
    LngParam:
      name: lng
      in: query
      schema:
        type: number
        format: double
    RadiusParam:
      name: radius
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50000
        default: 3000
    PostIdParam:
      name: postId
      in: path
      required: true
      schema:
        type: string
    TargetTypeParam:
      name: targetType
      in: path
      required: true
      schema:
        type: string
        enum: [post, merchant]
    TargetIdParam:
      name: targetId
      in: path
      required: true
      schema:
        type: string
    FolloweeIdParam:
      name: followeeId
      in: path
      required: true
      schema:
        type: string
    UserIdParam:
      name: userId
      in: path
      required: true
      schema:
        type: string
    RequestIdParam:
      name: requestId
      in: path
      required: true
      schema:
        type: string
    OrderIdParam:
      name: orderId
      in: path
      required: true
      schema:
        type: string
    SceneParam:
      name: scene
      in: path
    CreateDraftRequest:
      type: object
      description: 当前版本草稿类型固定为 image_text，无需额外字段
    DraftData:
      type: object
      properties:
        postId:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
    PresignRequest:
      type: object
      required: [postId, filename, contentType, purpose]
      properties:
        postId:
          type: string
        filename:
          type: string
        contentType:
          type: string
        purpose:
          type: string
          enum: [content, image]
    PresignData:
      type: object
      properties:
        uploadUrl:
          type: string
          format: uri
        objectKey:
          type: string
        expireAt:
          type: string
          format: date-time
    ConfirmContentRequest:
      type: object
      required: [objectKey, etag, sha256, size]
      properties:
        objectKey:
          type: string
        etag:
          type: string
        sha256:
          type: string
        size:
          type: integer
    UpdatePostMetadataRequest:
      type: object
      properties:
        title:
          type: string
        summary:
          type: string
        tags:
          type: array
          items:
            type: string
        imageUrls:
          type: array
          items:
            type: string
            format: uri
        visibility:
          type: string
          enum: [public, followers, private]
        isTop:
          type: boolean
        location:
          $ref: '#/components/schemas/Location'
    InteractionCounters:
      type: object
      properties:
        likeCount:
          type: integer
        favoriteCount:
          type: integer
        commentCount:
          type: integer
    PostDetail:
      type: object
      properties:
        postId:
          type: string
        author:
          $ref: '#/components/schemas/UserProfileBrief'
        status:
          type: string
        title:
          type: string
        summary:
          type: string
        contentUrl:
          type: string
          format: uri
        imageUrls:
          type: array
          items:
            type: string
            format: uri
        tags:
          type: array
          items:
            type: string
        location:
          $ref: '#/components/schemas/Location'
        visibility:
          type: string
        type:
          type: string
        isTop:
          type: boolean
        publishedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PostCard:
      type: object
      properties:
        postId:
          type: string
        title:
          type: string
        summary:
          type: string
        coverUrl:
          type: string
          format: uri
          nullable: true
        tags:
          type: array
          items:
            type: string
        author:
          $ref: '#/components/schemas/UserProfileBrief'
        likeCount:
          type: integer
          format: int64
        favoriteCount:
          type: integer
          format: int64
        liked:
          type: boolean
          nullable: true
        faved:
          type: boolean
          nullable: true
        visibility:
          type: string
        isTop:
          type: boolean
        publishedAt:
          type: string
          format: date-time
    PostPageData:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PostCard'
        page:
          type: integer
        size:
          type: integer
        hasMore:
          type: boolean
    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
        accessExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshExpiresAt:
          type: string
          format: date-time
        tokenType:
          type: string
          example: Bearer
    AuthSessionData:
      type: object
      properties:
        userId:
          type: string
        tokens:
          $ref: '#/components/schemas/AuthTokens'
    RegisterResult:
      type: object
      properties:
        userId:
          type: string
        phone:
          type: string
        account:
          type: string
        nextAction:
          type: string
        status:
          type: string
    SendCodeRequest:
      type: object
      required: [identifier, scene]
      properties:
        identifier:
          type: string
        scene:
          type: string
          enum: [register, login, password_reset]
    SendCodeResponse:
      type: object
      properties:
        phone:
          type: string
        scene:
          type: string
          enum: [register, login, password_reset]
        code:
          type: string
        expireSeconds:
          type: integer
    RegisterRequest:
      type: object
      required: [phone, account, password, nickname, smsCode]
      properties:
        phone:
          type: string
        account:
          type: string
        password:
          type: string
        nickname:
          type: string
        smsCode:
          type: string
    LoginRequest:
