spring:
  application:
    name: zhiguang-be
  profiles:
    default: business
  ai:
    model:
      chat: none
    deepseek:
      chat:
        enabled: false
  datasource:
    url: jdbc:h2:file:./data/linli-auth;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: zhiguang-be
      auto-offset-reset: latest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  sql:
    init:
      mode: always

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,configprops,threaddump,loggers

storage:
  mock-upload-base-url: https://mock-oss.local/upload
  public-base-url: https://mock-oss.local/public
  presign-expire-seconds: 600

threadpool:
  trade-order:
    thread-name-prefix: trade-order-
    core-pool-size: 4
    maximum-pool-size: 8
    queue-capacity: 200
    keep-alive-seconds: 60
    buffer-degree: 0.5
    prevent-rejection: true
    thread-load-judge: 5
    cpu-load-judge: 0.7
    spin-wait-millis: 10
    block-timeout-millis: 100
    max-retry-attempts: 3
    allow-core-thread-timeout: false
  rag-query:
    thread-name-prefix: rag-query-
    core-pool-size: 2
    maximum-pool-size: 4
    queue-capacity: 100
    keep-alive-seconds: 60
    buffer-degree: 0.5
    prevent-rejection: true
    thread-load-judge: 4
    cpu-load-judge: 0.7
    spin-wait-millis: 10
    block-timeout-millis: 100
    max-retry-attempts: 3
    allow-core-thread-timeout: false

cache:
  local:
    max-entries-per-region: 1024
    cleanup-batch-size: 64
  hotkey:
    enabled: true
    window-seconds: 60
    segment-seconds: 10
    level-low: 50
    level-medium: 200
    level-high: 500
    extend-low-seconds: 20
    extend-medium-seconds: 60
    extend-high-seconds: 120
    jitter-seconds: 5
    max-tracked-keys: 10000

llm:
  provider: template
  model-name: template-llm
  fallback-to-template: true
  http:
    endpoint:
    api-key:
    timeout-seconds: 10
    stream-enabled: false
    temperature: 0.2
    max-tokens: 1024

canal:
  enabled: false
  host: localhost
  port: 11111
  destination: example
  username:
  password:
  filter: .*\\.outbox
  batch-size: 100
  interval-ms: 1000
  topic: canal-outbox

search:
  provider: db
  default-page-size: 20
  max-page-size: 20
  fetch-multiplier: 3
  max-fetch-limit: 100
  default-suggest-size: 10
  max-suggest-size: 20
  snippet-length: 80
  enable-tag-suggest: true
  es:
    endpoint: http://localhost:9200
    index: zhiguang_content_index
    username:
    password:
    api-key:
    connect-timeout-seconds: 3
    socket-timeout-seconds: 5
    auto-create-index: true
    auto-rebuild-on-startup: false
    rebuild-batch-size: 200
    use-ik-analyzer: false
  outbox:
    local-sync-enabled: true
    kafka-enabled: false
    topic: canal-outbox
    group-id: search-index-consumer
    dedup-ttl-minutes: 10

rag:
  query:
    default-top-k: 5
    max-top-k: 10
    public-search-page-size: 20
    public-search-max-pages: 3
    nearby-boost-radius-meters: 3000
    nearby-boost-score: 8
  stream:
    timeout-millis: 60000
    chunk-size: 48
    chunk-delay-millis: 80
  index:
    max-chunk-length: 200
    chunk-step: 160
    fetch-timeout-seconds: 5
    fallback-to-metadata: true
    auto-rebuild-on-startup: false
    rebuild-page-size: 20
    rebuild-max-pages: 20
  vector:
    store-enabled: false
    endpoint: http://localhost:9200
    index-name: zhiguang_rag_chunk_index
    username:
    password:
    api-key:
    auto-create-index: true
    candidate-size: 64
    embedding-endpoint:
    embedding-api-key:
    embedding-model: text-embedding-3-small
    embedding-timeout-seconds: 10
    allow-local-fallback: true
    dimension: 1536
    min-similarity: 0.12
    vector-weight: 0.7
    keyword-weight: 0.3
    title-boost: 0.08

discover:
  lbs:
    default-type: knowledge
    cache-ttl-seconds: 120
    local-cache-ttl-seconds: 5
    lock-ttl-seconds: 10
    lock-wait-timeout-millis: 800
    lock-retry-interval-millis: 40
    max-redis-fetch-count: 1000
    min-radius-meters: 100
    max-radius-meters: 50000
    max-page-size: 100
    fail-open-on-search-error: false
    map-provider:
      enabled: false
      provider: amap
      api-key:
      geocode-endpoint: https://restapi.amap.com/v3/geocode/geo
      reverse-geocode-endpoint: https://restapi.amap.com/v3/geocode/regeo
      poi-search-endpoint: https://restapi.amap.com/v5/place/around

social:
  relation:
    rate-limit:
      capacity: 100
      refill-per-second: 1
    outbox:
      local-projection-enabled: true
      kafka-enabled: false
      topic: canal-outbox
      group-id: relation-outbox-consumer
      dedup-ttl-minutes: 10
    repair:
      enabled: false
      fixed-delay-ms: 60000
      batch-size: 100
      max-batches-per-run: 20
  counter:
    kafka:
      enabled: false
      # Production keeps broker acknowledgement in the request-side projection by default.
      sync-send: true
      send-timeout-ms: 3000
      flush-delay-ms: 1000
    rebuild:
      lock-ttl-ms: 5000
      rate-permits: 3
      rate-window-seconds: 10
      backoff-base-ms: 500
      backoff-max-ms: 30000
  interaction-projection:
    # Kept synchronous outside the isolated pressure-test profile.
    async-enabled: false
  rebuild:
    enabled: false
    group-id: counter-rebuild
    target-type:
    entity-id-min: -1
    entity-id-max: -1
    dry-run: false
    dedup-ttl-days: 7

trade:
  kafka:
    enabled: false
  order:
    pay-timeout-minutes: 15
    close-scan-delay-ms: 60000
    close-batch-size: 100
    redis-reconcile-delay-ms: 10000
    status-ttl-hours: 48
  cache:
    activity-ttl-seconds: 300
    null-ttl-seconds: 60
    rebuild-lock-seconds: 5
    jitter-seconds: 120

security:
  user-store: jdbc
  refresh-store: redis
  login-blacklist:
    enabled: true
  login-risk:
    captcha-threshold: 3
    block-threshold: 10
    failure-ttl-minutes: 30
  verification:
    code-ttl-minutes: 10
    code-length: 6
    max-attempts: 5
    send-interval-seconds: 60
    daily-limit: 10
  jwt:
    issuer: zhiguang-be
    key-id: zhiguang-rsa
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
    public-key: ""
    private-key: ""
    allow-ephemeral-keys: false
    verification-keys: []
