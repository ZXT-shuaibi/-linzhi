spring:
  application:
    name: zhiguang-be
  datasource:
    url: jdbc:h2:file:./data/linli-auth;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: zhiguang-be
      auto-offset-reset: latest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  sql:
    init:
      mode: always

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

storage:
  mock-upload-base-url: https://mock-oss.local/upload
  public-base-url: https://mock-oss.local/public
  presign-expire-seconds: 600

cache:
  local:
    max-entries-per-region: 1024
    cleanup-batch-size: 64

llm:
  provider: template
  model-name: template-llm
  fallback-to-template: true
  http:
    endpoint:
    api-key:
    timeout-seconds: 10

social:
  counter:
    kafka:
      enabled: false
      flush-delay-ms: 1000
    rebuild:
      lock-ttl-ms: 5000
      rate-permits: 3
      rate-window-seconds: 10
      backoff-base-ms: 500
      backoff-max-ms: 30000
  rebuild:
    enabled: false

trade:
  kafka:
    enabled: false
  order:
    pay-timeout-minutes: 15
    close-scan-delay-ms: 60000
    close-batch-size: 100
    redis-reconcile-delay-ms: 10000
    status-ttl-hours: 48
  cache:
    activity-ttl-seconds: 300
    null-ttl-seconds: 60
    rebuild-lock-seconds: 5
    jitter-seconds: 120

security:
  user-store: jdbc
  refresh-store: redis
  login-blacklist:
    enabled: true
  login-risk:
    captcha-threshold: 3
    block-threshold: 10
    failure-ttl-minutes: 30
  verification:
    code-ttl-minutes: 10
    code-length: 6
    max-attempts: 5
    send-interval-seconds: 60
    daily-limit: 10
  jwt:
    issuer: zhiguang-be
    key-id: zhiguang-rsa
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
    public-key: ""
    private-key: ""
    allow-ephemeral-keys: true
