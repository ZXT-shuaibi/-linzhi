spring:
  application:
    name: zhiguang-be
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

security:
  refresh-store: redis
  login-blacklist:
    enabled: true
  jwt:
    issuer: zhiguang-be
    key-id: zhiguang-rsa
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
    public-key: ""
    private-key: ""
    allow-ephemeral-keys: false